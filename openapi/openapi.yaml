  /exec-approvals/grants:
    get:
      operationId: listExecApprovalGrants
      tags: [ExecApprovals]
      summary: List durable exec-approval grants (command names)
      description: |
        Returns the command names with durable ("Always Allow") grants from the
        configured `ExecApprovalStore` grant store, sorted ascending.
      responses:
        "200":
          description: Durable grant command names
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecApprovalGrantsResponse"

  /exec-approvals/grants/{commandName}:
    delete:
      operationId: revokeExecApprovalGrant
      tags: [ExecApprovals]
      summary: Revoke a durable exec-approval grant by command name
      parameters:
        - name: commandName
          in: path
          required: true
          description: Command name to revoke. Accepts percent-encoded values (e.g. `git%20status`).
          schema:
            type: string
      responses:
        "200":
          description: Grant revoked
        "400":
          description: Invalid command name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Grant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /exec-approvals/{id}:
    post:
      operationId: resolveExecApproval
      tags: [ExecApprovals]
      deprecated: true
      summary: Resolve a pending exec-approval request (deprecated alias of POST /approvals/{id})
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecApprovalResolutionRequest"
      responses:
        "200":
          description: Approval resolution accepted
        "400":
          description: Invalid exec approval id or request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Exec approval not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /approvals/{id}:
    post:
      operationId: resolveApproval
      tags: [Approvals]
      summary: Resolve a pending approval on the unified decision vocabulary
      description: |
        Unified resolve endpoint for approvals. Prefer `decision`
        (`allowOnce`|`allowAlways`|`deny`); the `approved`/`durable` fields remain
        for compatibility with the deprecated `POST /exec-approvals/{id}` alias.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnifiedApprovalResolutionRequest"
      responses:
        "200":
          description: Approval resolution accepted
        "400":
          description: Invalid approval id or request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Approval not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

components:
  securitySchemes:
    HarnessAccessBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        HS256 harness access JWT verified with `ServerConfig.apiAccessTokenHS256Secret`.
        The owner principal is the JWT `sub` claim (UUID string). Required for strict tenancy
        mutations when `requireAuthenticatedTenantOnAPI` is enabled. Legacy `X-SAH-Authenticated-Owner`
        is not trusted.

  parameters:
    ConversationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    ModelId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    EngineArtifactKey:
      name: key
      in: path
      required: true
      description: |
        Single path segment; server rejects `..`, slashes, and empty keys. UTF-8 opaque identifier chosen by the engine client.
      schema:
        type: string
        minLength: 1

    IfMatch:
      name: If-Match
      in: header
      required: false
      description: |
        Optimistic concurrency token (quoted ETag). Guarded mutations require **`If-Match`** by default and return
        **428** (`HTTPPreconditionRequiredBody`) when omitted; mismatched tokens return **412**
        (`HTTPPreconditionFailedBody`).
      schema:
        type: string

    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: |
        Cache validator for registry reads. Matching value returns **304 Not Modified**.
      schema:
        type: string

    ContextCompactionPreviewToken:
      name: X-SAH-Context-Compaction-Preview-Token
      in: header
      required: true
      description: Shared authorization token for context-compaction preview/manual routes.
      schema:
        type: string

  schemas:
    WireJSONObject:
      type: object
      additionalProperties: true
      description: Arbitrary JSON object matching Swift Codable wire encoding.

    HTTPPreconditionRequiredBody:
      type: object
      required: [error, resourceUrl]
      properties:
        error:
          type: string
          enum: [precondition_required]
        resourceUrl:
          type: string
          description: Canonical mutation URL for the precondition check.

    HTTPPreconditionFailedBody:
      type: object
      required: [error, currentVersion, yourVersion, resourceUrl]
      properties:
        error:
          type: string
          enum: [precondition_failed]
        currentVersion:
          type: string
          description: Normalized server ETag token (unquoted).
        yourVersion:
          type: string
          description: Normalized client If-Match token (unquoted).
        resourceUrl:
          type: string

    ToolListingSource:
      type: string
      enum: [local, mcp, a2a, unknown]

    AvailableToolInfo:
      type: object
      required: [name, description, source]
      properties:
        name:
          type: string
        description:
          type: string
        source:
          $ref: "#/components/schemas/ToolListingSource"
        normalizedSchemaFingerprint:
          type: string
        normalizedSchemaVersion:
          type: string
        normalizedTopLevelType:
          type: string
        normalizedRequiredCount:
          type: integer
        normalizedPropertyCount:
          type: integer

    AvailableSkillInfo:
      type: object
      required: [name, description]
      properties:
        name:
          type: string
        description:
          type: string

    ModeProfileDTO:
      type: object
      required: [id, label]
      properties:
        id:
          type: string
        label:
          type: string
        description:
          type: [string, "null"]
        symbol:
          type: [string, "null"]
        summary:
          $ref: "#/components/schemas/ModeProfileSummary"

    ModeProfileSummary:
      type: object
      properties:
        toolPolicy:
          type: [string, "null"]
          description: Summary classification for tool policy (all, restricted, none).
        compaction:
          type: [string, "null"]
          description: Context compaction level summary.
        maxIterations:
          type: [integer, "null"]
          minimum: 1
        modelTier:
          type: [string, "null"]
          description: Coarse model-tier hint for picker chips.

    ModesCatalogResponse:
      type: object
      required: [profiles]
      properties:
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/ModeProfileDTO"

    StatusResponse:
      type: object
      required: [status, sessions]
      properties:
        status:
          type: string
        sessions:
          type: integer

    FullSystemPromptResponse:
      type: object
      required: [fullSystemPrompt]
      properties:
        fullSystemPrompt:
          type: string

    LLMCapability:
      type: string
      description: SwiftAgentKit LLMCapability raw values (intrinsic model gates).
      enum:
        - unknown
        - completion
        - tools
        - insert
        - vision
        - audio
        - embedding
        - thinking
        - reasoningRequired
        - promptCacheEphemeral
        - promptCachePersistent
        - imageGeneration

    ModelCostBudget:
      type: object
      properties:
        inputPer1MUSD:
          type: number
          format: double
        outputPer1MUSD:
          type: number
          format: double
        cachedInputPer1MUSD:
          type: number
          format: double

    ModelRateLimitMetadata:
      type: object
      required: [requests, tokens, windowMs]
      properties:
        requests:
          type: integer
        tokens:
          type: integer
        windowMs:
          type: integer

    ModelRoutingMetadata:
      type: object
      properties:
        rateLimit:
          $ref: "#/components/schemas/ModelRateLimitMetadata"

    ModelInfo:
      type: object
      required: [id, modelName, modelProtocol, capabilities]
      properties:
        id:
          type: string
          format: uuid
        modelName:
          type: string
        modelProtocol:
          type: string
          enum: [ollama, openAIAPI, lmStudio]
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/LLMCapability"
        requestFeatures:
          type: object
          additionalProperties: true
          description: SwiftAgentKit ModelRequestFeatures JSON (optional for older clients).
        cost:
          $ref: "#/components/schemas/ModelCostBudget"
        routing:
          $ref: "#/components/schemas/ModelRoutingMetadata"

    ModelCallAttemptKind:
      type: string
      enum: [retry, bindingFailover, modelSubstitution, authProbeSkip, promptCache]

    ModelCallAttemptOutcome:
      type: string
      enum: [continued, succeeded, terminalFailure, skipped, observed]

    ModelCallAttemptRecord:
      type: object
      required: [attemptIndex, kind, outcome, observedAt]
      properties:
        attemptIndex:
          type: integer
          minimum: 1
        kind:
          $ref: "#/components/schemas/ModelCallAttemptKind"
        outcome:
          $ref: "#/components/schemas/ModelCallAttemptOutcome"
        observedAt:
          type: string
          format: date-time
        providerID:
          type: string
        endpointModelID:
          type: string
        targetModelID:
          type: string
          format: uuid
        promptCacheMode:
          type: string
          enum: [none, ephemeral, persistent]
        promptCacheStablePrefixMessageCount:
          type: integer
          minimum: 1
        promptCacheProviderSupportsNative:
          type: boolean
        promptCacheProviderApplied:
          type: boolean
        promptCacheEstimatedInputTokens:
          type: integer
          minimum: 0
        promptCacheEstimatedCachedInputTokens:
          type: integer
          minimum: 0
        promptCacheEstimatedCacheWriteTokens:
          type: integer
          minimum: 0
        promptCacheEstimatedSavingsUSD:
          type: number
          format: double
        promptCacheValuesAreProviderReported:
          type: boolean
        promptCacheUnexpectedCacheWrite:
          type: boolean
        errorClass:
          type: string
        errorCode:
          type: string
        latencyMs:
          type: number
          format: double

    ModelCallRecord:
      type: object
      required: [callID, phase, startedAt, updatedAt]
      properties:
        callID:
          type: string
          format: uuid
        logicalRequestID:
          type: string
          format: uuid
        rootCallID:
          type: string
          format: uuid
        attemptIndex:
          type: integer
          minimum: 1
        conversationID:
          type: string
          format: uuid
        phase:
          type: string
        startedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        attempts:
          type: array
          items:
            $ref: "#/components/schemas/ModelCallAttemptRecord"

    ModelCallsPayload:
      type: object
      required: [modelID, active, recent, updatedAt]
      properties:
        modelID:
          type: string
          format: uuid
        active:
          type: array
          items:
            $ref: "#/components/schemas/ModelCallRecord"
        recent:
          type: array
          items:
            $ref: "#/components/schemas/ModelCallRecord"
        updatedAt:
          type: string
          format: date-time

    ModelCallsResponse:
      type: object
      required: [modelID, calls]
      properties:
        modelID:
          type: string
          format: uuid
        calls:
          $ref: "#/components/schemas/ModelCallsPayload"

    ListModelsResponse:
      type: object
      required: [models]
      properties:
        models:
          type: array
          items:
            $ref: "#/components/schemas/ModelInfo"

    QueryModelsRequest:
      type: object
      properties:
        modelRef:
          type: string
        modelID:
          type: string
          format: uuid
        idOrQuery:
          type: string
      description: Provide at least one model reference input field.

    QueryModelsResponse:
      type: object
      required: [matches]
      properties:
        matches:
          type: array
          items:
            $ref: "#/components/schemas/ModelInfo"

    ConversationEventsBackfillResponse:
      type: object
      required: [conversationID, latestSeq, lagging, events]
      properties:
        conversationID:
          type: string
          format: uuid
        since:
          type: integer
        latestSeq:
          type: integer
        lagging:
          type: boolean
        events:
          type: array
          description: JSON-encoded harness topic envelope lines.
          items:
            type: string

    ConversationListSort:
      type: string
      enum:
        - updatedAtDesc
        - updatedAtAsc
        - createdAtDesc
        - createdAtAsc

    ConversationSearchMode:
      type: string
      enum:
        - substring
        - fts

    ConversationSearchKind:
      type: string
      enum:
        - fulltext
        - semantic

    ConversationSearchHit:
      type: object
      required:
        - conversationID
        - messageID
        - excerpt
      properties:
        conversationID:
          type: string
          format: uuid
        messageID:
          type: string
          format: uuid
        excerpt:
          type: string
        score:
          type: number
          format: double
        rank:
          type: integer
        conversationTopic:
          type: [string, "null"]

    ConversationSearchResponse:
      type: object
      required:
        - hits
        - totalHitCount
      properties:
        hits:
          type: array
          items:
            $ref: "#/components/schemas/ConversationSearchHit"
        totalHitCount:
          type: integer
          description: Number of matching messages before applying offset/limit pagination.
        warning:
          type: [string, "null"]
        nextOffset:
          type: [integer, "null"]
          description: Offset to request the next page when more hits exist.

    ConversationLifecycleState:
      type: string
      enum:
        - active
        - suspended
        - archived
        - deleted

    ConversationListSummary:
      type: object
      required:
        - id
        - modelName
        - messageCount
        - createdAt
        - updatedAt
        - lifecycle
        - tags
      properties:
        id:
          type: string
          format: uuid
        modelName:
          type: string
        topic:
          type: [string, "null"]
        description:
          type: [string, "null"]
        messageCount:
          type: integer
        createdAt:
          type: string
        updatedAt:
          type: string
        lifecycle:
          $ref: "#/components/schemas/ConversationLifecycleState"
        tags:
          type: array
          items:
            type: string
        controlPlaneRevision:
          type: integer
          minimum: 0
          description: Monotonic control-plane revision for PATCH optimistic concurrency.

    PagedConversationsResponse:
      type: object
      required: [items, totalCount]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ConversationListSummary"
        totalCount:
          type: integer
        nextOffset:
          type: [integer, "null"]

    ConversationBranchRequest:
      type: object
      required: [userMessageID]
      properties:
        userMessageID:
          type: string
          format: uuid

    ConversationBranchResponse:
      type: object
      required: [conversationID]
      properties:
        conversationID:
          type: string
          format: uuid

    ConversationRevertRequest:
      type: object
      required: [userMessageID]
      properties:
        userMessageID:
          type: string
          format: uuid
        includeTools:
          type: boolean
          description: Optional runtime flag; defaults to `true` when omitted.
        includeAgents:
          type: boolean
          description: Optional runtime flag; defaults to `true` when omitted.

    SubAgentSpawnRequest:
      type: object
      properties:
        context:
          type: string
          enum: [fork, isolated]
          description: Launch context; defaults to `isolated` when omitted.
        userMessageID:
          type: string
          format: uuid
          description: Required when `context` is `fork` (same anchor as `POST …/branch`).
        taskDescription:
          type: string
        prompt:
          type: string
        subagentType:
          type: string
        agentID:
          type: string
        agentRef:
          type: string
        agentQuery:
          $ref: "#/components/schemas/SubAgentQuery"
        hostPersonaID:
          type: string
        authScopeTags:
          type: array
          items: { type: string }
        routingDomain:
          type: string
        tenantScope:
          type: string
        runInBackground:
          type: boolean
        modelRef:
          $ref: "#/components/schemas/ModelRef"
          description: Optional model override for `isolated`; ignored for `fork`.
        userSystemPrompt:
          type: string
        topic:
          type: string
        description:
          type: string
        metadata:
          $ref: "#/components/schemas/WireJSONObject"
        interactionMode:
          type: string
        toolsAllow:
          type: array
          items: { type: string }
          description: >
            Optional closed-world tool allowlist applied to the child conversation as
            routingPrefs.explicitToolPolicy. Omit to leave routing policy unset (mode profile alone).
            An empty array denies all tools.
    SubAgentQuery:
      type: object
      properties:
        text:
          type: string
        transportKinds:
          type: array
          items: { type: string }
        useClasses:
          type: array
          items: { type: string }
        permissionPolicies:
          type: array
          items: { type: string }
        trustLevels:
          type: array
          items: { type: string }
        requiresStreaming:
          type: boolean
        requiresLongRunning:
          type: boolean
        hostPersonaID:
          type: string
        authScopeTags:
          type: array
          items: { type: string }
        routingDomain:
          type: string
        tenantScope:
          type: string

    CompletionAnnounceStatus:
      type: string
      enum: [done, failed]

    CompletionAnnounceTriggerRequest:
      type: object
      required: [delegateHandleID, toolCallID, lifecycleID, status]
      properties:
        announceID:
          type: string
          format: uuid
        delegateHandleID:
          type: string
        toolCallID:
          type: string
        lifecycleID:
          type: string
        parentConversationID:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/CompletionAnnounceStatus"
        completedAt:
          type: string
          format: date-time
        source:
          type: string
        error:
          type: string
        toolMessageContent:
          type: string

    CompletionAnnounceTriggerResponse:
      type: object
      required: [announceID, status]
      properties:
        announceID:
          type: string
          format: uuid
        status:
          type: string
          enum: [accepted]

    ToolApprovalRoute:
      type: string
      enum: [user, parent]

    ToolApprovalResolutionStatus:
      type: string
      enum: [approved, denied, pending]

    ToolApprovalResolutionRequest:
      type: object
      required: [toolName, status]
      properties:
        runID:
          type: string
          format: uuid
        toolName:
          type: string
        toolCallID:
          type: string
          description: Optional correlation id for the pending tool call (UI only).
        route:
          $ref: "#/components/schemas/ToolApprovalRoute"
        status:
          $ref: "#/components/schemas/ToolApprovalResolutionStatus"
        source:
          type: string
        reason:
          type: string
        durable:
          type: boolean
          description: When true and status is `approved`, persists an allow-always tool rule so future runs auto-approve this tool.
        arguments:
          type: object
          additionalProperties: true
          description: Tool call arguments used to identify the pending approval binding. Required when multiple pending approvals exist for the same tool name.

    ConversationCheckpointInvalidateRequest:
      type: object
      properties:
        kinds:
          type: array
          items:
            type: string
          description: Harness kinds (e.g. `context_compaction`). Omit or empty → server default.

    ConversationCheckpointInvalidateResponse:
      type: object
      required: [kinds]
      properties:
        kinds:
          type: array
          items:
            type: string

    InteractionModeChangedEventPayload:
      type: object
      required:
        - fromMode
        - toMode
        - fromProfileID
        - toProfileID
        - fromPhase
        - toPhase
        - initiatedBy
      properties:
        fromMode:
          type: string
        toMode:
          type: string
        fromProfileID:
          type: string
        toProfileID:
          type: string
        fromPhase:
          type: string
        toPhase:
          type: string
        initiatedBy:
          type: string
          description: Source of the transition request (for example `api`, `websocket`, `internal`).
        reason:
          type: string

    ConversationJournalEventWire:
      type: object
      required:
        - eventID
        - kind
        - payloadJSON
        - createdAt
        - journalStream
        - streamSequence
      properties:
        eventID:
          type: integer
        kind:
          type: string
        payloadJSON:
          type: string
          description: |
            Opaque JSON payload for the journal event kind. For
            `kind == "interaction_mode_changed"`, this JSON conforms to
            `#/components/schemas/InteractionModeChangedEventPayload`.
        basedOnEventID:
          type: integer
        coversStartEventID:
          type: integer
        coversEndEventID:
          type: integer
        createdAt:
          type: string
          format: date-time
        journalStream:
          type: string
          enum: [raw, derived]
        streamSequence:
          type: integer

    ConversationReadWithDerivedResponse:
      type: object
      required: [conversation, rawEvents, derivedEvents]
      properties:
        conversation:
          $ref: "#/components/schemas/WireJSONObject"
        rawEvents:
          type: array
          items:
            $ref: "#/components/schemas/WireJSONObject"
        derivedEvents:
          type: array
          items:
            $ref: "#/components/schemas/ConversationJournalEventWire"

    ConversationProjectionConfig:
      type: object
      properties:
        options:
          $ref: "#/components/schemas/WireJSONObject"

    ConversationProjectRequest:
      type: object
      properties:
        config:
          $ref: "#/components/schemas/ConversationProjectionConfig"

    ConversationProjectionMetadata:
      type: object
      required: [frontierEventID, rawEventCount, derivedEventCount]
      properties:
        frontierEventID:
          type: integer
        rawEventCount:
          type: integer
        derivedEventCount:
          type: integer
        config:
          $ref: "#/components/schemas/ConversationProjectionConfig"

    ConversationProjectResponse:
      type: object
      required: [projectedMessages, metadata]
      properties:
        projectedMessages:
          type: array
          items:
            $ref: "#/components/schemas/WireJSONObject"
        metadata:
          $ref: "#/components/schemas/ConversationProjectionMetadata"

    ConversationPatch:
      type: object
      description: Partial update; omitted keys leave fields unchanged.
      required: [expectedRevision]
      properties:
        topic:
          type: string
        description:
          type: string
        metadata:
          $ref: "#/components/schemas/WireJSONObject"
        interactionMode:
          type: string
          enum: [chat, plan, agent]
        modeProfileID:
          type: string
          description: Optional persisted mode registry pointer (`ModeRegistry` profile id).
        disabledToolNames:
          type: array
          items:
            type: string
        disabledSkillNames:
          type: array
          items:
            type: string
        routingModelOptions:
          $ref: "#/components/schemas/ConversationRoutingModelOptions"
        lifecycle:
          $ref: "#/components/schemas/ConversationLifecycleState"
        modelRef:
          type: string
          description: Canonical model ref (UUID or registry slug).
        userSystemPrompt:
          type: string
          description: Persisted user system prompt fragment for the conversation.
        expectedRevision:
          type: integer
          minimum: 0
          description: Must match server `controlPlaneRevision` or receive 409 `revision_mismatch`.
        routingToolPolicy:
          $ref: "#/components/schemas/ConversationExplicitToolPolicy"

    ConversationExplicitToolPolicy:
      type: object
      required: [kind, tools, skills]
      description: |
        Conversation-level routing tool/skill policy (harness `routing.toolWhitelist`).
        Intersects with mode profile `tools.allow` — both must permit a tool for it to be available.
      properties:
        kind:
          type: string
          enum: [allowlist, denylist]
        tools:
          type: array
          items:
            type: string
        skills:
          type: array
          items:
            type: string

    ThinkingLevel:
      type: string
      enum: [off, minimal, low, medium, high, xhigh]

    ThinkingConfig:
      description: Conversation thinking configuration (`disabled` | `adaptive` | `{ level, budgetTokens? }`).
      oneOf:
        - type: string
          enum: [disabled, adaptive]
        - type: object
          required: [level]
          properties:
            level:
              $ref: "#/components/schemas/ThinkingLevel"
            budgetTokens:
              type: integer
              minimum: 0

    ConversationRoutingModelOptions:
      type: object
      properties:
        thinkingConfig:
          $ref: "#/components/schemas/ThinkingConfig"

    ConversationPatchResponse:
      type: object
      required: [type, controlPlaneRevision]
      properties:
        type:
          type: string
          enum: [update]
        controlPlaneRevision:
          type: integer
          minimum: 0

    ContextCompactionSyntheticMessageWire:
      type: object
      required: [id, role, content]
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
        content:
          type: string

    ContextCompactionCheckpointWire:
      type: object
      required:
        - schemaVersion
        - kind
        - coveredMessageIDs
        - syntheticMessages
        - configFingerprint
        - basedOnEventID
        - createdAt
      properties:
        schemaVersion:
          type: integer
        kind:
          type: string
        coveredMessageIDs:
          type: array
          items:
            type: string
            format: uuid
        syntheticMessages:
          type: array
          items:
            $ref: "#/components/schemas/ContextCompactionSyntheticMessageWire"
        configFingerprint:
          type: string
        basedOnEventID:
          type: integer
        basedOnTailMessageID:
          type: string
          format: uuid
          description: Optional; omitted when null on the wire.
        createdAt:
          type: number
          description: |
            Swift `Date` default JSON encoding (seconds since reference date) unless server changes encoder.

    LatestCheckpointResponse:
      type: object
      required: [kind, eventID, checkpoint]
      properties:
        kind:
          type: string
          enum:
            - context_compaction
            - memory_injection_snapshot
            - tool_result_trim
            - system_prompt_assembly
        eventID:
          type: integer
        checkpoint:
          description: Shape matches `kind` (discriminated union).
          oneOf:
            - $ref: "#/components/schemas/ContextCompactionCheckpointWire"
            - $ref: "#/components/schemas/MemoryInjectionSnapshotCheckpointWire"
            - $ref: "#/components/schemas/ToolResultTrimCheckpointWire"
            - $ref: "#/components/schemas/SystemPromptAssemblyCheckpointWire"

    ConversationRunWireStatus:
      type: string
      enum:
        - running
        - completed
        - cancelled
        - failed

    ConversationRunTerminalCategory:
      type: string
      enum:
        - externalCancellation
        - naturalStop
        - boundedStop
        - failure

    ConversationRunBoundedReason:
      type: string
      enum:
        - maxAgentIterations
        - userStopRequested
        - runawayEmptyAssistantStreak
        - repeatToolCallStreak
        - chattyAssistantLimit
        - maxContinuationRounds

    ConversationRunTerminalReason:
      type: object
      required: [category]
      properties:
        category:
          $ref: "#/components/schemas/ConversationRunTerminalCategory"
        boundedReason:
          $ref: "#/components/schemas/ConversationRunBoundedReason"
        detail:
          type: string
          description: Optional human-readable sub-detail.

    ConversationRunToolRollup:
      type: object
      required: [distinctToolNames, totalToolCallSlots]
      properties:
        distinctToolNames:
          type: array
          items:
            type: string
          description: Sorted distinct tool names observed on assistant rows in this run.
        totalToolCallSlots:
          type: integer
          minimum: 0
          description: Total tool-name slots across assistant rows (one row may declare multiple tools).

    ConversationRunProjectionDetail:
      type: object
      required: [assistantMessageCount]
      properties:
        assistantMessageCount:
          type: integer
          minimum: 0
          description: Assistant transcript rows attributed to this run; **`toolRollup`** is present only when at least one tool-name slot exists on those rows.
        toolRollup:
          $ref: "#/components/schemas/ConversationRunToolRollup"

    ConversationRunTokenRollup:
      type: object
      required: [promptTokens, completionTokens, totalTokens]
      properties:
        promptTokens:
          type: integer
          minimum: 0
        completionTokens:
          type: integer
          minimum: 0
        totalTokens:
          type: integer
          minimum: 0
          description: Authoritative run total from persisted completion usage (falls back to prompt+completion when source omits explicit total).

    ConversationRunCostRollup:
      type: object
      required: [usd]
      properties:
        usd:
          type: number
          minimum: 0
          description: Authoritative per-run USD sum over persisted completion usage rows.

    ConversationRunOutcome:
      type: string
      enum:
        - completed
        - cancelled
        - errored
        - bounded
        - open

    ConversationRunKind:
      type: string
      enum:
        - live
        - trigger
        - channel
        - delegate

    ConversationRunErrorDetails:
      type: object
      required: [class, message]
      properties:
        class:
          type: string
          description: Stable terminal error class (`run_errored`, `run_orphaned`, etc.).
        message:
          type: string
          description: Human-readable detail for errored terminal outcomes.

    ConversationRunInfo:
      type: object
      description: |
        Canonical run projection aligned to harness `runs.md`: boundary anchors, terminal outcome,
        and per-run iteration/tool counts. **`tokenRollup`** / **`costRollup`** remain authoritative sums
        over persisted run usage rows and may be present on both list/get surfaces. **`projectionDetail`** is included
        only when **`GET /conversations/{id}/runs/{runId}?detail=1`** requests transcript-derived rollups
        (omitted on list **`GET …/runs`**). Optional **`terminalReason`** is derived enrichment from the same
        closing boundary as **`outcome`** (marker kind is authoritative for category; structured marker fields
        enrich only). It may be omitted for natural assistant completion until that mapping is specified.
        Persistence marker kinds are not exposed on this resource.
      required: [id, conversationID, outcome, iterationCount, toolCallCount, firstMessageId]
      properties:
        id:
          type: string
          format: uuid
        conversationID:
          type: string
          format: uuid
        outcome:
          $ref: "#/components/schemas/ConversationRunOutcome"
        startedAt:
          description: ISO8601 when known; omitted when unknown.
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          description: Set when the run reached a terminal outcome (omitted while **`open`**).
        iterationCount:
          type: integer
          minimum: 0
          description: Number of assistant iterations observed in this run segment.
        toolCallCount:
          type: integer
          minimum: 0
          description: Total tool-call slots observed on assistant rows in this run segment.
        firstMessageId:
          type: string
          description: Entry id anchor for the opening user message that started the run.
        lastMessageId:
          type: [string, "null"]
          description: Entry id anchor for terminal closure (`null` while run outcome is `open`).
        cancellationReason:
          type: [string, "null"]
          description: Present for cancelled outcomes.
        errorDetails:
          $ref: "#/components/schemas/ConversationRunErrorDetails"
        terminalReason:
          $ref: "#/components/schemas/ConversationRunTerminalReason"
        tokenRollup:
          $ref: "#/components/schemas/ConversationRunTokenRollup"
        costRollup:
          $ref: "#/components/schemas/ConversationRunCostRollup"
        projectionDetail:
          $ref: "#/components/schemas/ConversationRunProjectionDetail"

    ConversationRunListResponse:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          items:
            $ref: "#/components/schemas/ConversationRunInfo"
        cursor:
          type: [string, "null"]
          description: Opaque continuation cursor for next page.
        total:
          type: integer
          minimum: 0
          description: Advisory total count of runs that matched the filter.

    AppendInputResponse:
      type: object
      required: [runId, messageId]
      properties:
        runId:
          type: string
          format: uuid
        messageId:
          type: string
          format: uuid

    CancelConversationRunRequest:
      type: object
      required: [runId]
      properties:
        runId:
          type: string
          format: uuid

    CancelConversationRunResponse:
      type: object
      required: [runId, outcome]
      properties:
        runId:
          type: string
          format: uuid
        outcome:
          $ref: "#/components/schemas/ConversationRunOutcome"

    CancelConversationRunConflictCode:
      type: string
      enum: [run_not_in_flight, run_already_ended]

    CancelConversationRunConflictBody:
      type: object
      required: [code, runId]
      properties:
        code:
          $ref: "#/components/schemas/CancelConversationRunConflictCode"
        runId:
          type: string
          format: uuid
        outcome:
          $ref: "#/components/schemas/ConversationRunOutcome"

    EngineArtifactKeysResponse:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: string
          description: Sorted stable key names for artifacts cached under this conversation.

    ConversationRunConflictBody:
      type: object
      required: [code, conversationID, activeRunID]
      properties:
        code:
          type: string
          enum: [run_in_progress, mode_change_run_in_progress]
        conversationID:
          type: string
          format: uuid
        activeRunID:
          type: string
          format: uuid

    ConversationRevisionConflictBody:
      type: object
      required: [code, conversationID, expectedRevision, currentRevision]
      properties:
        code:
          type: string
          enum: [revision_mismatch]
        conversationID:
          type: string
          format: uuid
        expectedRevision:
          type: integer
          minimum: 0
        currentRevision:
          type: integer
          minimum: 0

    MemoryInjectionSnapshotCheckpointWire:
      type: object
      required:
        - schemaVersion
        - basedOnEventID
        - injectionFingerprint
        - snapshotJSON
        - scopeMessageIDs
        - createdAt
      properties:
        schemaVersion:
          type: integer
        basedOnEventID:
          type: integer
        injectionFingerprint:
          type: string
        snapshotJSON:
          type: string
        scopeMessageIDs:
          type: array
          items:
            type: string
            format: uuid
        createdAt:
          type: number

    ToolResultTrimCheckpointWire:
      type: object
      required:
        - schemaVersion
        - basedOnEventID
        - coveredMessageIDs
        - trimmedToolCallIds
        - configFingerprint
        - createdAt
      properties:
        schemaVersion:
          type: integer
        basedOnEventID:
          type: integer
        coveredMessageIDs:
          type: array
          items:
            type: string
            format: uuid
        trimmedToolCallIds:
          type: array
          items:
            type: string
        configFingerprint:
          type: string
        createdAt:
          type: number

    SystemPromptAssemblyCheckpointWire:
      type: object
      required:
        - schemaVersion
        - basedOnEventID
        - assemblyFingerprint
        - createdAt
      properties:
        schemaVersion:
          type: integer
        basedOnEventID:
          type: integer
        assemblyFingerprint:
          type: string
        createdAt:
          type: number

    ChatRequest:
      type: object
      required: [message, imageNames]
      properties:
        conversationID:
          type: string
          description: |
            Legacy request field. Canonical send routing uses path id on
            `POST /conversations/{id}/messages`; this field is ignored by that route.
        message:
          type: string
        imageNames:
          type: array
          items:
            type: string
        includeTools:
          type: boolean
        includeAgents:
          type: boolean
        expectedPreviousTailHarnessMessageID:
          type: string
          format: uuid
          description: |
            When set, the server rejects the send if the active transcript tail’s harness-visible message id
            does not match (HTTP 409 + `TranscriptTailConflictBody`). Omit for legacy single-client behavior.
        inputTrust:
          type: string
          description: |
            Optional user-input trust string. Known values include `direct_user_entry`, `automation`,
            and `scripted`. Unknown non-empty values are accepted for forward compatibility and mapped
            to the server trust-policy safe default class.

    TranscriptTailConflictBody:
      type: object
      required: [code, conversationID, expectedTailMessageID]
      properties:
        code:
          type: string
          enum: [transcript_tail_mismatch]
        conversationID:
          type: string
          format: uuid
        expectedTailMessageID:
          type: string
          format: uuid
        actualTailMessageID:
          description: Omitted when the transcript was empty but the client expected a tail id.
          type: [string, "null"]
          format: uuid

    ErrorEnvelope:
      type: object
      properties:
        type:
          type: string
          enum: [error]
        message:
          type: string

    ExecApprovalGrantsResponse:
      type: object
      required: [commandNames]
      properties:
        commandNames:
          type: array
          items:
            type: string
          description: Command names with durable grants, sorted ascending.

    ExecApprovalResolutionRequest:
      type: object
      required: [approved]
      properties:
        approved:
          type: boolean
        durable:
          type: boolean
          description: When true and approved, persists a durable grant by command name.
        reason:
          type: string
          description: Optional denial reason.

    ApprovalDecision:
      type: string
      description: The unified approval decision vocabulary. `timeout` and `cancelled` are produced by the core lifecycle, not by a client.
      enum: [allowOnce, allowAlways, deny, timeout, cancelled]

    UnifiedApprovalResolutionRequest:
      type: object
      description: |
        Resolve body for `POST /approvals/{id}`. Provide `decision` (preferred) or
        the legacy `approved`/`durable` pair.
      properties:
        decision:
          $ref: "#/components/schemas/ApprovalDecision"
        approved:
          type: boolean
          description: Legacy flag; `true` maps to `allowOnce` (or `allowAlways` when `durable` is true), `false` maps to `deny`.
        durable:
          type: boolean
          description: When true with `approved`, resolves as `allowAlways`.
        reason:
          type: string
          description: Optional denial reason.

    SimpleTypeResponse:
      type: object
      properties:
        type:
          type: string

    ConversationMutationResponse:
      type: object
      properties:
        type:
          type: string
          enum: [create, copy]
        conversationID:
          type: string

    ModelRef:
      type: string
      description: |
        Canonical addressing for a registered model. Either a UUID matching
        `Model.id` or a slug matching the canonical `Model.modelName`
        (the primary `ProviderBinding.endpointModelId`).

    ConvoRequest:
      type: object
      properties:
        modelRef:
          $ref: "#/components/schemas/ModelRef"
          description: Create model selector. Accepts UUID or slug.
        userSystemPrompt:
          type: string
        topic:
          type: string
        description:
          type: string
        metadata:
          $ref: "#/components/schemas/WireJSONObject"
        interactionMode:
          type: string
        modeProfileID:
          type: string

    UpdateToolOverridesRequest:
      type: object
      required: [disabledToolNames]
      properties:
        disabledToolNames:
          type: array
          items:
            type: string

    UpdateSkillOverridesRequest:
      type: object
      required: [disabledSkillNames]
      properties:
        disabledSkillNames:
          type: array
          items:
            type: string

    UpdateConversationMetadataRequest:
      type: object
      properties:
        topic:
          type: string
        description:
          type: string
        metadata:
          $ref: "#/components/schemas/WireJSONObject"
        interactionMode:
          type: string
        modeProfileID:
          type: string

    PreviewContextCompactionRequest:
      type: object
      properties:
        forceRunCompactionLLM:
          type: boolean
        ignoreTokenThreshold:
          type: boolean
        compactionSummarizerDebugOutputPath:
          type: string

    ManualContextCompactionRequest:
      type: object
      properties:
        reason:
          type: string

    ConversationPlanResponse:
      type: object
      required: [markdown]
      properties:
        markdown:
          type: string

    FileUploadResponse:
      type: object
      required: [filename, size, contentType, filePath]
      properties:
        filename:
          type: string
        size:
          type: integer
        contentType:
          type: string
        filePath:
          type: string
