openapi: 3.1.0
info:
  title: SwiftAgentHarness HTTP API
  version: 1.37.0
  description: |
    Control plane for SwiftAgentHarness (Vapor `/api` group). Does not include WebSocket `/ws` —
    see `asyncapi.yaml` and `schemas/ws/` for harness-shaped envelopes.

    **Dates:** `GET /conversations/{id}` uses ISO-8601 for `Date` fields. List endpoints may use
    numeric timestamps — see API/ARCHITECTURE.md.

    **v1.1.0:** Conversation list query modes (`GET /conversations`), `PATCH /conversations/{id}`,
    `GET /conversations/{id}/checkpoints/latest`, `DELETE` soft/hard query param; see `Documentation/CRUD_QUERY_API_INVENTORY.md`.

    **v1.2.0:** `searchMode` on paged list, `POST /conversations/{id}/branch`, `POST …/checkpoints`,
    optional `kind` on latest checkpoint, soft-delete retention + background purge (see `ServerConfig`).

    **v1.3.0:** `GET /search` — harness-style cross-conversation message search (ranked hits + excerpts;
    not SQLite FTS; see `CRUD_QUERY_API_INVENTORY.md`).

    **v1.4.0:** Conversation mutations consolidated on `PATCH /conversations/{id}` (`ConversationPatch`), including
    model ref and user system prompt; former `PUT` sub-routes removed.

    **v1.5.0:** `GET /conversations/{id}/checkpoints/latest` returns a discriminated **`LatestCheckpointResponse`**
    (`kind` + `checkpoint` oneOf: compaction, memory injection, tool trim, system prompt assembly).

    **v1.6.0:** Conversation **run** resources: `GET /conversations/{id}/runs`, `GET …/runs/{runId}`, `POST …/runs/{runId}/cancel`;
    `PATCH /conversations/{id}` may return **409** with **`ConversationRunConflictBody`** (`code`: **`mode_change_run_in_progress`**) when an interaction mode / phase change is requested during an active streaming run.

    **v1.7.0:** `POST /messages` **`ChatRequest`** optional **`expectedPreviousTailHarnessMessageID`**.

    **v1.8.0:** Paged **`GET /conversations`** and nested conversation controls were introduced for migration work.

    **v1.9.0:** **`PATCH /conversations/{id}`** optional **`expectedRevision`** (optimistic concurrency); success returns **`controlPlaneRevision`**. **409** may return **`ConversationRevisionConflictBody`** (`code`: **`revision_mismatch`**). See **`Documentation/CONVERSATION_PATCH_REVISION.md`**.

    **v1.10.0:** `POST /messages` **`ChatRequest`** optional **`inputTrust`** (user-message provenance; aligns with **`Message`** JSON **`inputTrust`** on **`GET /messages`**).

    **v1.11.0:** Paged **`GET /conversations`** optional **`owner`** (UUID tenant filter; **400** if non-empty and not a valid UUID). Same **`owner`** semantics on **`GET /search`**. Paged list hits persisted rows via backend query.

    **v1.12.0:** Send-path conflict harmonization: **`POST /messages`** and **`POST /messages/trigger`** return **409 + JSON** for append conflicts (`transcript_tail_mismatch`, `run_in_progress`) before stream commit; they no longer encode these conflicts as plain-text stream chunks. WebSocket parity adds **`patch_conversation`** with structured **`revision_mismatch`** (`ConversationRevisionConflictBody`) aligned with REST patch semantics.

    **v1.13.0:** Run lifecycle durability without a standalone run table: **`GET /conversations/{id}/runs`** and **`GET /conversations/{id}/runs/{runId}`** survive restart.

    **v1.14.0:** Run list/get projection is **transcript-derived** for **v2** harness conversations: segmentation walks **`HarnessSessionPersistence.readTranscriptEntries`** using persisted **`transcriptRunID`** on mirrored rows and terminal **`custom`** markers (`run_cancelled`, `run_orphaned`, `run_bounded`, `run_errored`). Conversations without the v2 transcript store return an empty run history on these routes. `POST …/runs/{runId}/cancel` semantics remain “active in-flight run only”.

    **v1.15.0:** Per-client REST/WS session headers and cookies remain for request scoping and tenancy alignment.

    **v1.16.0:** **`GET/PUT/DELETE /conversations/{id}/engine-artifacts`** (+ keyed paths): raw-byte upload/download (**`application/octet-stream`**), JSON key listing, **`413`** when over configured max body size, **`501`** when harness artifact storage is unavailable. Strict tenancy: validated **`Authorization: Bearer`** JWT when **`requireAuthenticatedTenantOnAPI`** is enabled — see **`Documentation/CRUD_QUERY_API_INVENTORY.md`**.

    **v1.17.0:** **`ConversationRunInfo`** optional transcript-derived **`projectionDetail`** (assistant/tool rollups), and authoritative persisted usage rollups (**`tokenRollup`**, **`costRollup`**). **`GET /conversations/{id}/runs/{runId}?detail=1`** requests **`projectionDetail`**; list **`GET …/runs`** omits `projectionDetail` for a lightweight payload while still including authoritative usage rollups when available. Terminal-reason schema components were introduced here; durable projection onto **`ConversationRunInfo`** landed in **v1.36.0**. **`Documentation/RUNS_SPEC_ALIGNMENT.md`** maps harness **runs.md** / **appendInput** to REST/WebSocket.

    **v1.19.0:** **`POST /conversations/{id}/branch`** HTTP strict preconditions: optional **`If-Match`** against parent transcript tail (**`msg-*`**, **`msg-none`** when empty); **`428`**/**`412`** when **`ServerConfig.httpPreconditionsStrictMode`** is enabled (same ETag family as send). (Collection read auto-scoping moved to **v1.36.0**.)

    **v1.18.0:** **`Documentation/SESSION_SCOPING.md`** documents explicit conversation-id routing on REST and legacy WS control frames.

    **v1.20.0:** Legacy websocket **`type:patch_conversation`** is removed (deterministic error envelope). Canonical control-plane patch mutation is **`PATCH /conversations/{id}`** only, with strict precondition support (**`If-Match`** → **`412`**/**`428`**) and structured **`type:error`** envelopes for bad ID/not found validation paths.

    **v1.21.0:** Adds canonical in-place revert mutation **`POST /conversations/{id}/revert`** (chunked assistant stream; transcript-tail preconditions via **`If-Match`** → **`412`**/**`428`** in strict mode). Legacy websocket **`type:revert_to_message`** is removed with deterministic migration guidance to REST.

    **v1.22.0:** Legacy websocket **`type:split_conversation`** is removed (deterministic error envelope). Canonical split control-plane mutation is **`POST /conversations/{id}/branch`** only.

    **v1.23.0:** Legacy websocket **`type:stop_agent_build`** is removed (deterministic error envelope). Canonical stop mutation is **`POST /conversations/{id}/cancel`**.

    **v1.24.0:** Legacy websocket **`type:spawn_sub_agent`** is removed (deterministic error envelope).

    **v1.25.0:** Legacy websocket **`type:resolve_tool_approval`** is removed (deterministic error envelope). Canonical approval mutation is **`POST /conversations/{id}/tool-approvals`** with structured `type:error` envelopes for invalid ID/body/not found/unsupported paths.

    **v1.26.0:** Legacy websocket **`type:push_completion_announce`** is removed (deterministic error envelope). Canonical completion ingestion mutation is **`POST /conversations/{id}/completion-announcements`** with structured `type:error` envelopes for invalid ID/body/not found/unsupported paths.

    **v1.27.0:** Legacy REST aliases **`GET /messages`**, **`POST /messages`**, and **`POST /messages/agent_build/stop`** are removed. Canonical read/send/stop paths are **`GET /conversations/{id}`** (embedded `messages`), **`POST /conversations/{id}/messages`**, and **`POST /conversations/{id}/cancel`**.

    **v1.27.1:** Trigger send routes (`POST /conversations/{id}/messages/trigger` and legacy `/messages/trigger`) are runtime ingress extensions outside communication-layer contract scope. External callers are expected to use a trigger gate enforcing idempotency, rate limits, authorization, and cost ceilings before dispatch.

    **v1.27.2:** API trigger ingress is removed. `POST /messages/trigger` and `POST /conversations/{id}/messages/trigger` are no longer part of the HTTP API contract; trigger dispatch must come through the non-API trigger gate boundary.

    **v1.27.3:** Replay control endpoints are removed from HTTP API (`POST /messages/replay/start`, `POST /messages/replay/stop`, `GET /messages/replay/status`). Harness replay semantics remain ordered history transfer on topic/data-plane surfaces.

    **v1.27.4:** Conversation-scoped capability routes are removed (`GET /conversations/{id}/available-tools`, `GET /conversations/{id}/available-skills`). Canonical registry reads are global `GET /tools`, `GET /skills`, and `GET /sub-agents` with conditional `If-None-Match` / `304`.

    **v1.27.5:** REST orchestration snapshot helpers are removed (`GET /conversations/{id}/orchestration-state`, `GET /conversations/{id}/turn-state`). Runtime state snapshots remain available on WebSocket topic `conversation/{id}/state`.

    **v1.28.0:** HTTP control-plane parity and stricter defaults: adds **`POST /models/query`**, **`GET /conversations/{id}/events?since=`**, and canonical **`GET /search`**. Mutation preconditions are strict-by-default for guarded routes.

    **v1.29.0:** Conversation read/projection parity: **`GET /conversations/{id}?includeDerived=true`** returns
    the conversation snapshot plus persisted `rawEvents` and `derivedEvents`; **`POST /conversations/{id}/projection`**
    returns the on-demand projected message view with projection metadata.

    **v1.30.0:** Conversation mode profile pointer parity: create/patch payloads accept **`modeProfileID`** and
    persisted conversation payloads may include this registry pointer alongside derived coarse **`interactionMode`**.

    **v1.32.0:** **`ConversationPatch.expectedRevision`** is required on **`PATCH /conversations/{id}`** (last-write-wins without revision is removed).

    **v1.33.0:** Tool listing split: **`GET /tools`** returns the global registered catalog (unfiltered); **`GET /conversations/{id}/tools`** returns effective tools for that conversation (mode profile, routing whitelist, disabled tools). Replaces removed **`GET /conversations/{id}/available-tools`**.

    **v1.34.0:** Skill listing split: **`GET /conversations/{id}/skills`** returns effective skills for that conversation (mode profile, routing whitelist, disabled skills). Replaces removed **`GET /conversations/{id}/available-skills`** for picker/UI reads; global **`GET /skills`** remains the registry read with ETag support.

    **v1.35.0:** Strict authenticated tenancy now requires validated **`Authorization: Bearer`** harness access JWTs (HS256; `sub` = owner UUID via `ServerConfig.apiAccessTokenHS256Secret`). Legacy **`X-SAH-Authenticated-Owner`** is ignored. `APILayer.start()` fails closed when `requireAuthenticatedTenantOnAPI` is enabled without a configured secret.

    **v1.36.0:** Strict tenancy collection reads: **`GET /conversations`** and **`GET /search`** auto-scope to the Bearer JWT `sub` claim ( **`401`** without a valid token, **`403`** when **`owner=`** mismatches the authenticated principal). Model-tool **`list_conversations`** applies the same owner scope when strict tenancy is enabled. Durable run projection adds optional **`ConversationRunInfo.terminalReason`** (boundary-authoritative enrichment from lifecycle markers; legacy-marker fallbacks; natural assistant completion may omit). **`markerKind`** is not part of the public run shape.

    **v1.37.0:** **`POST /conversations/{id}/revert`** commits HTTP **200** to the wire before the first assistant token (early chunked-body flush, typically a leading `\n` keepalive) so clients that wait on response headers / first byte are not blocked by provider TTFT or model cold-start. The success body remains raw UTF-8 assistant text chunks; leading flush bytes are ignorable whitespace only (not JSON error framing).

servers:
  - url: "{origin}/api"
    description: Replace `{origin}` with server origin (scheme + host + port); paths below are relative to `/api`.
    variables:
      origin:
        default: http://127.0.0.1:8080

tags:
  - name: Core
    description: Status, prompts, models
  - name: Conversations
    description: Conversation CRUD and metadata
  - name: Messages
    description: Messages and replay control plane.
  - name: Upload
    description: File upload for chat attachments
  - name: ExecApprovals
    description: Exec-approval resolution and durable command grants

paths:
  /status:
    get:
      operationId: getApiStatus
      tags: [Core]
      summary: Server health and session count
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"

  /system_prompt/full:
    get:
      operationId: getFullSystemPrompt
      tags: [Core]
      summary: Expanded system prompt for the current session
      parameters:
        - name: userSystemPrompt
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FullSystemPromptResponse"

  /models:
    get:
      operationId: getApiModels
      tags: [Core]
      summary: List available models
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListModelsResponse"
        "304":
          description: Not modified for matching If-None-Match

  /models/query:
    post:
      operationId: queryModels
      tags: [Core]
      summary: Resolve model reference into ranked matches
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryModelsRequest"
      responses:
        "200":
          description: Query matches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryModelsResponse"
        "304":
          description: Not modified for matching If-None-Match
        "400":
          description: Missing or invalid model reference input.

  /models/{id}/state:
    get:
      operationId: getModelState
      tags: [Core]
      summary: Get schedulability-oriented model state snapshot
      parameters:
        - $ref: "#/components/parameters/ModelId"
      responses:
        "200":
          description: Latest model state snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WireJSONObject"
        "400":
          description: Invalid model id or state unavailable.

  /models/{id}/calls:
    get:
      operationId: getModelCalls
      tags: [Core]
      summary: Get active and recent call ledger for one model
      parameters:
        - $ref: "#/components/parameters/ModelId"
      responses:
        "200":
          description: Model call ledger snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelCallsResponse"
        "400":
          description: Invalid model id or calls unavailable.

  /models/{id}/calls/events:
    get:
      operationId: streamModelCallEvents
      tags: [Core]
      summary: Stream model call ledger updates
      parameters:
        - $ref: "#/components/parameters/ModelId"
      responses:
        "200":
          description: Server-sent event stream of model call snapshots
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Invalid model id or event stream unavailable.

  /conversations:
    get:
      operationId: listConversations
      tags: [Conversations]
      summary: List conversations (paged summaries)
      description: |
        Canonical conversation catalog list route. Returns `PagedConversationsResponse`
        using the provided filters (or defaults when omitted).
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
        - name: search
          in: query
          schema:
            type: string
        - name: searchMode
          in: query
          description: |
            `substring` (default) matches topic, description, and tags. `fts` also scans message bodies
            on persisted transcript rows (not SQLite FTS5).
          schema:
            $ref: "#/components/schemas/ConversationSearchMode"
        - name: lifecycle
          in: query
          schema:
            $ref: "#/components/schemas/ConversationLifecycleState"
        - name: includeArchived
          in: query
          schema:
            type: boolean
        - name: includeDeleted
          in: query
          schema:
            type: boolean
        - name: sort
          in: query
          schema:
            $ref: "#/components/schemas/ConversationListSort"
        - name: updatedAfter
          in: query
          description: ISO8601 date-time filter (inclusive lower bound on `updatedAt`).
          schema:
            type: string
        - name: updatedBefore
          in: query
          description: ISO8601 date-time filter (exclusive upper bound on `updatedAt`).
          schema:
            type: string
        - name: owner
          in: query
          description: |
            Optional UUID; when set, only conversations whose cached `ownerAccountID` matches. Omit for no owner filter when strict tenancy is disabled.
            A non-empty value that is not a valid UUID returns **400** (no silent unscoped list).

            **Strict tenancy (`requireAuthenticatedTenantOnAPI`):** results auto-scope to the Bearer JWT `sub` claim.
            **`owner=`** matching the authenticated principal is allowed (redundant); a mismatched **`owner=`** returns **403**.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Paged conversations response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedConversationsResponse"
        "400":
          description: Invalid query parameters (e.g. malformed `owner` UUID).
        "401":
          description: Authenticated owner required (strict tenancy).
        "403":
          description: Conversation not accessible for this authenticated owner (strict tenancy; mismatched `owner=`).
    post:
      operationId: createConversation
      tags: [Conversations]
      summary: Create conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConvoRequest"
      responses:
        "200":
          description: Create result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationMutationResponse"
        "400":
          description: Invalid or unknown model reference.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /search:
    get:
      operationId: searchConversations
      tags: [Conversations]
      summary: Search message bodies across conversations
      description: |
        **`GET /search`** is distinct from paged `GET /conversations` with `search=` (metadata + optional in-memory list scan).

        This endpoint returns **ranked message hits** with **excerpts** over persisted SwiftData `CachedMessage` rows (localized contains / AND-of-whitespace-terms; synchronous request-time scan — no separate FTS index).

        **`kind=semantic`** is reserved; responses include `hits: []` and a `warning` until embeddings-backed search exists.
      parameters:
        - name: q
          in: query
          required: true
          description: Search text (whitespace splits AND terms).
          schema:
            type: string
        - name: kind
          in: query
          description: "fulltext (default) or semantic (not implemented)."
          schema:
            $ref: "#/components/schemas/ConversationSearchKind"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: owner
          in: query
          description: |
            When set, only conversations whose persisted `ownerAccountID` matches this UUID are included.
            A non-empty value that is not a valid UUID returns **400**.

            **Strict tenancy:** search auto-scopes to the Bearer JWT `sub` claim. A mismatched **`owner=`** returns **403**.
          schema:
            type: string
            format: uuid
        - name: includeArchived
          in: query
          schema:
            type: boolean
            default: false
        - name: includeDeleted
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Ranked search hits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationSearchResponse"
        "400":
          description: Missing or empty `q`, or malformed `owner` UUID.
        "401":
          description: Authenticated owner required (strict tenancy).
        "403":
          description: Conversation not accessible for this authenticated owner (strict tenancy; mismatched `owner=`).

  /conversations/{id}/events:
    get:
      operationId: backfillConversationEvents
      tags: [Conversations]
      summary: Backfill conversation events from persisted transcript
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - name: since
          in: query
          required: false
          description: Replay cursor (exclusive sequence) for legacy total-order backfill.
          schema:
            type: integer
            minimum: 0
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Backfill lines plus replay metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationEventsBackfillResponse"
        "304":
          description: Not modified for matching If-None-Match
        "400":
          description: Invalid conversation id or backfill request.

  /conversations/{id}/plan:
    get:
      operationId: getConversationPlan
      tags: [Conversations]
      summary: Server-local plan.md markdown
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Plan markdown JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationPlanResponse"
        "404":
          description: Not found

  /conversations/{id}/tools:
    get:
      operationId: listConversationTools
      tags: [Conversations]
      summary: Effective tools for a conversation (mode/routing/disabled filtered)
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Effective tool rows for the conversation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AvailableToolInfo"
        "404":
          description: Conversation not found

  /conversations/{id}/skills:
    get:
      operationId: listConversationSkills
      tags: [Conversations]
      summary: Effective skills for a conversation (mode/routing/disabled filtered)
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Effective skill rows for the conversation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AvailableSkillInfo"
        "404":
          description: Conversation not found

  /conversations/{id}/slash-commands:
    get:
      operationId: listSlashCommands
      tags: [Conversations]
      summary: Slash command autocomplete rows
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Slash commands array
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WireJSONObject"
        "400":
          description: Bad request / error JSON

  /conversations/{id}/preview-context-compaction:
    post:
      operationId: postPreviewContextCompaction
      tags: [Conversations]
      summary: Non-persisting compaction preview (gated + auth header)
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/ContextCompactionPreviewToken"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewContextCompactionRequest"
      responses:
        "200":
          description: Preview result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WireJSONObject"
        "401":
          description: Missing/invalid preview token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Preview route enabled but no token configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "400":
          description: Invalid conversation id or request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Route disabled, unknown conversation, or not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "501":
          description: Not implemented on provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /conversations/{id}/compact:
    post:
      operationId: postManualCompact
      tags: [Conversations]
      summary: Persisting manual compaction (gated + auth header)
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/ContextCompactionPreviewToken"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualContextCompactionRequest"
      responses:
        "200":
          description: Compaction result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WireJSONObject"
        "401":
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Manual compaction enabled but no preview token configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "400":
          description: Invalid conversation id or request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Disabled or unknown conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "501":
          description: Not implemented on provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /conversations/{id}/server-metadata:
    get:
      operationId: getConversationServerMetadata
      tags: [Conversations]
      summary: Optional server-only metadata blob
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Metadata JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WireJSONObject"
        "404":
          description: Not found

  /conversations/{id}/branch:
    post:
      operationId: branchConversationAtUserMessage
      tags: [Conversations]
      summary: Fork conversation at a user message (control plane)
      description: |
        Canonical split control-plane replacement. Creates a new conversation from the transcript
        prefix through the given user message, selects the fork, and does **not** start an LLM
        streaming turn. Legacy websocket `type:split_conversation` is removed.

        **HTTP preconditions:** When **`ServerConfig.httpPreconditionsStrictMode`** is enabled, send **`If-Match`** with the
        parent transcript tail token (**`msg-{uuid}`** for the last message, **`msg-none`** when the transcript is empty),
        matching **`POST /conversations/{id}/messages`**. Omitted header → **428**; stale token → **412**.
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationBranchRequest"
      responses:
        "200":
          description: New fork id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationBranchResponse"
        "400":
          description: Structured `type:error` envelope for invalid ID/body/anchor
        "404":
          description: Structured `type:error` envelope for unknown conversation
        "412":
          description: Stale If-Match (transcript tail mismatch)
          headers:
            ETag:
              description: Current transcript tail token (quoted).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPPreconditionFailedBody"
        "428":
          description: Strict precondition mode requires If-Match on this mutation
          headers:
            ETag:
              description: Current transcript tail token when known (quoted).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPPreconditionRequiredBody"

  /conversations/{id}/revert:
    post:
      operationId: revertConversationAtUserMessage
      tags: [Conversations]
      summary: In-place revert to user message and regenerate (chunked streaming response)
      description: |
        Truncates the existing conversation transcript after `userMessageID` and starts a new assistant run from that anchor.
        This is the canonical replacement for legacy websocket `type:revert_to_message`.

        **HTTP preconditions:** When **`ServerConfig.httpPreconditionsStrictMode`** is enabled, send **`If-Match`** with the
        current transcript tail token (**`msg-{uuid}`** for the last message, **`msg-none`** when empty).
        Omitted header → **428**; stale token → **412**.
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationRevertRequest"
      responses:
        "200":
          description: |
            Chunked assistant stream after successful in-place revert.

            The **200** status (and an ignorable early flush chunk, typically a leading `\n`) is
            written to the connection before the first LLM token so clients are not blocked on
            provider TTFT / model load. Body bytes are raw UTF-8 substrings of the assistant reply
            (no per-chunk JSON framing). Leading flush bytes are whitespace-only and may be ignored
            when concatenating the HTTP body into assistant text. Failures after headers are not
            encoded as JSON in this stream; observe WebSocket lifecycle / turn terminal events instead.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid request body or revert anchor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Unknown conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Optimistic execution conflict (tail mismatch or run already in progress).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/TranscriptTailConflictBody"
                  - $ref: "#/components/schemas/ConversationRunConflictBody"
        "412":
          description: Stale If-Match value for strict preconditions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPPreconditionFailedBody"
        "428":
          description: Strict precondition mode requires If-Match on this mutation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPPreconditionRequiredBody"

  /conversations/{id}/completion-announcements:
    post:
      operationId: pushCompletionAnnouncement
      tags: [Conversations]
      summary: Push a delegated completion announcement
      description: |
        Canonical announce ingestion route for delegated sub-agent completion events.
        The server de-duplicates by `delegateHandleID` + `toolCallID` and fan-outs runtime/sub-agent lifecycle updates.
        This is the canonical replacement for legacy websocket `type:push_completion_announce`.
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletionAnnounceTriggerRequest"
      responses:
        "200":
          description: Completion announce accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompletionAnnounceTriggerResponse"
        "400":
          description: Invalid conversation id or request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Unknown conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "501":
          description: Completion announce ingestion unsupported in current runtime
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /conversations/{id}/tool-approvals:
    post:
      operationId: resolveToolApproval
      tags: [Conversations]
      summary: Resolve runtime tool approval decision
      description: |
        Canonical tool-approval resolution control-plane route.
        This is the canonical replacement for legacy websocket `type:resolve_tool_approval`.
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToolApprovalResolutionRequest"
      responses:
        "200":
          description: Approval resolution accepted
        "400":
          description: Invalid conversation id or request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Unknown conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "501":
          description: Tool approval resolution unsupported in current runtime
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /conversations/{id}/checkpoints/invalidate:
    post:
      operationId: invalidateConversationCheckpoints
      tags: [Conversations]
      summary: Invalidate durable checkpoints for selected harness kinds
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationCheckpointInvalidateRequest"
      responses:
        "200":
          description: Kinds that were applied (defaults expanded when body omitted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationCheckpointInvalidateResponse"
        "404":
          description: Unknown conversation

  /conversations/{id}/checkpoints/latest:
    get:
      operationId: getLatestCheckpoint
      tags: [Conversations]
      summary: Latest valid harness checkpoint by kind
      description: |
        Returns the latest valid checkpoint for the requested harness `kind`, or 404 when none or the conversation
        is missing. Top-level `kind` matches the query param (default `context_compaction`). The `checkpoint`
        object shape depends on `kind` — see `LatestCheckpointResponse`.
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - name: kind
          in: query
          required: false
          description: |
            Harness checkpoint discriminant: `context_compaction` (default), `memory_injection_snapshot`,
            `tool_result_trim`, `system_prompt_assembly`.
          schema:
            type: string
      responses:
        "200":
          description: Checkpoint envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LatestCheckpointResponse"
        "404":
          description: No checkpoint or unknown conversation

  /conversations/{id}/runs:
    get:
      operationId: listConversationRuns
      tags: [Conversations]
      summary: List derived runs for a conversation
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/IfNoneMatch"
        - name: kinds
          in: query
          required: false
          description: Filter by run kind from opening input trust class.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ConversationRunKind"
        - name: outcomes
          in: query
          required: false
          description: Filter by terminal outcome.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ConversationRunOutcome"
        - name: since
          in: query
          required: false
          description: Unix timestamp (milliseconds). Include runs that started strictly after this timestamp.
          schema:
            type: number
            minimum: 0
        - name: limit
          in: query
          required: false
          description: Max runs to return (default 50, max 200).
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          required: false
          description: Opaque continuation cursor from a prior list response.
          schema:
            type: string
      responses:
        "200":
          description: Paged run summaries (newest-first), derived from the durable transcript.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationRunListResponse"
        "304":
          description: Not modified when `If-None-Match` matches.
        "400":
          description: Invalid id or query parameters

  /conversations/{id}/runs/{runId}:
    get:
      operationId: getConversationRun
      tags: [Conversations]
      summary: Get one run by id
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/IfNoneMatch"
        - name: detail
          in: query
          required: false
          description: |
            When truthy (`1`, `true`, or `yes`), include **`projectionDetail`** (transcript-derived assistant/tool rollups).
            Omitted or false keeps the summary-only shape aligned with list responses.
          schema:
            type: string
      responses:
        "200":
          description: Run summary when found in transcript-derived run history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationRunInfo"
        "304":
          description: Not modified when `If-None-Match` matches.
        "400":
          description: Invalid id
        "404":
          description: Unknown conversation or run id not recorded

  /conversations/{id}/runs/{runId}/cancel:
    post:
      operationId: cancelConversationRun
      tags: [Conversations]
      summary: Cancel the active run when run id matches the in-flight orchestration
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Cancellation accepted or already cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelConversationRunResponse"
        "409":
          description: Requested run is not in flight or already ended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelConversationRunConflictBody"
        "400":
          description: Invalid id
        "404":
          description: Unknown conversation
        "412":
          description: Stale If-Match value for strict preconditions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPPreconditionFailedBody"

  /conversations/{id}/cancel:
    post:
      operationId: cancelCurrentConversationRun
      tags: [Conversations]
      summary: Canonical cancelRun route for in-flight run cancellation
      description: |
        Canonical replacement for legacy websocket `type:stop_agent_build`.
        Caller scopes cancellation to an explicit `runId` in the request body.
        Repeated cancel for the same run is idempotent and returns the same cancelled outcome.
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelConversationRunRequest"
      responses:
        "200":
          description: Cancellation accepted or already cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelConversationRunResponse"
        "409":
          description: Requested run is not in flight or already ended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelConversationRunConflictBody"
        "400":
          description: Invalid conversation id or body
        "404":
          description: Unknown conversation
        "412":
          description: Stale If-Match value for strict preconditions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPPreconditionFailedBody"

  /conversations/{id}/engine-artifacts:
    get:
      operationId: listEngineArtifacts
      tags: [Conversations]
      summary: List cached engine artifact keys for a conversation
      description: |
        Returns JSON `{ "keys": [string] }`. Requires harness-backed artifact storage for this conversation; otherwise **501**.
        When strict authenticated tenancy is enabled, send **`Authorization: Bearer`** with a harness access JWT whose `sub` matches the conversation **`ownerAccountID`**.
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Key list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngineArtifactKeysResponse"
        "400":
          description: Invalid conversation id
        "403":
          description: Conversation not accessible for this authenticated owner (strict tenancy)
        "401":
          description: Authenticated owner required (strict tenancy)
        "404":
          description: Unknown conversation (strict tenancy — missing row)
        "501":
          description: Engine artifact store not available for this conversation
    delete:
      operationId: evictAllEngineArtifacts
      tags: [Conversations]
      summary: Delete all engine artifacts cached for a conversation
      description: Idempotent **204**. Same tenancy and availability semantics as GET.
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "204":
          description: Evicted (or none present)
        "400":
          description: Invalid conversation id
        "403":
          description: Conversation not accessible for this authenticated owner (strict tenancy)
        "401":
          description: Authenticated owner required (strict tenancy)
        "404":
          description: Unknown conversation (strict tenancy)
        "501":
          description: Engine artifact store not available for this conversation

  /conversations/{id}/engine-artifacts/{key}:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
      - $ref: "#/components/parameters/EngineArtifactKey"
    get:
      operationId: getEngineArtifact
      tags: [Conversations]
      summary: Download one engine artifact (raw bytes)
      responses:
        "200":
          description: Artifact bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid conversation id or artifact key
        "403":
          description: Conversation not accessible for this authenticated owner (strict tenancy)
        "401":
          description: Authenticated owner required (strict tenancy)
        "404":
          description: Unknown conversation or missing artifact
        "501":
          description: Engine artifact store not available for this conversation
    put:
      operationId: putEngineArtifact
      tags: [Conversations]
      summary: Upload or replace one engine artifact (raw body)
      description: |
        Request body is the artifact bytes. **`413`** when the body exceeds the configured maximum (**`ServerConfig.engineArtifactMaxUploadBytes`**).
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: Stored
        "400":
          description: Invalid conversation id or artifact key
        "403":
          description: Conversation not accessible for this authenticated owner (strict tenancy)
        "401":
          description: Authenticated owner required (strict tenancy)
        "404":
          description: Unknown conversation (strict tenancy)
        "413":
          description: Payload too large
        "501":
          description: Engine artifact store not available for this conversation
    delete:
      operationId: deleteEngineArtifact
      tags: [Conversations]
      summary: Delete one cached engine artifact by key
      responses:
        "204":
          description: Deleted (or key absent — still success)
        "400":
          description: Invalid conversation id or artifact key
        "403":
          description: Conversation not accessible for this authenticated owner (strict tenancy)
        "401":
          description: Authenticated owner required (strict tenancy)
        "404":
          description: Unknown conversation (strict tenancy)
        "501":
          description: Engine artifact store not available for this conversation

  /conversations/{id}:
    get:
      operationId: getConversationById
      tags: [Conversations]
      summary: Get single conversation (ISO8601 dates)
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - name: includeDerived
          in: query
          required: false
          description: |
            When truthy (`1`, `true`, `yes`, `on`), returns `ConversationReadWithDerivedResponse`
            including persisted `rawEvents` + `derivedEvents`. Default (`false`) keeps the existing
            `ModelConversation` snapshot shape.
          schema:
            type: boolean
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Conversation snapshot (default) or snapshot + persisted arrays (`includeDerived=true`)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/WireJSONObject"
                  - $ref: "#/components/schemas/ConversationReadWithDerivedResponse"
        "304":
          description: Not modified for matching If-None-Match
        "404":
          description: Not found
    patch:
      operationId: patchConversation
      tags: [Conversations]
      summary: Partial conversation update
      description: |
        Applies `ConversationPatch` (metadata, tools/skills, thinking, reasoning, lifecycle, model ref, user system prompt).
        Success body includes `type` and `controlPlaneRevision` (see **`ConversationPatchResponse`**).
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationPatch"
      responses:
        "200":
          description: Patch applied; returns new **`controlPlaneRevision`**
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationPatchResponse"
        "409":
          description: |
            Conflict — active streaming run blocks mode/phase change (**`ConversationRunConflictBody`**),
            or **`expectedRevision`** does not match (**`ConversationRevisionConflictBody`**).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ConversationRunConflictBody"
                  - $ref: "#/components/schemas/ConversationRevisionConflictBody"
        "400":
          description: Error JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Error JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "412":
          description: Stale If-Match value for strict preconditions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPPreconditionFailedBody"
        "428":
          description: Strict precondition mode requires If-Match on this mutation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPPreconditionRequiredBody"
    delete:
      operationId: deleteConversation
      tags: [Conversations]
      summary: Delete conversation (hard or soft)
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/IfMatch"
        - name: hard
          in: query
          required: false
          description: |
            When `true` (default), permanently removes the conversation. When `false`, soft-deletes
            (lifecycle **deleted**) without dropping rows immediately.
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Deleted (or soft-delete applied)
        "404":
          description: Error JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "412":
          description: Stale If-Match value for strict preconditions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPPreconditionFailedBody"
        "428":
          description: Strict precondition mode requires If-Match on this mutation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPPreconditionRequiredBody"

  /conversations/{id}/projection:
    post:
      operationId: projectConversation
      tags: [Conversations]
      summary: On-demand conversation projection view
      description: |
        Control-plane projection endpoint for `project(id, config?)`.
        Returns the projected message array plus projection metadata.
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationProjectRequest"
      responses:
        "200":
          description: Projection payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationProjectResponse"
        "400":
          description: Invalid id or request body
        "404":
          description: Unknown conversation
        "501":
          description: Projection unsupported in current provider/runtime

  /conversations/{id}/messages:
    post:
      operationId: postConversationMessage
      tags: [Messages]
      summary: Canonical appendInput route
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "201":
          description: |
            Input append accepted. Returns run/message anchors for data-plane correlation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppendInputResponse"
        "409":
          description: Optimistic append conflict (tail mismatch or run already in progress).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/TranscriptTailConflictBody"
                  - $ref: "#/components/schemas/ConversationRunConflictBody"
        "412":
          description: Stale If-Match value for strict preconditions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPPreconditionFailedBody"
        "428":
          description: Strict precondition mode requires If-Match on this mutation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPPreconditionRequiredBody"

