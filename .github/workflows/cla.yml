name: "CLA Assistant"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# Explicit permissions, in case GITHUB_TOKEN workflow permissions are set to read-only in repo settings.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        # Pinned: contributor-assistant/github-action was archived Mar 2026; v2.6.1 is the final release and remains functional.
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "signatures/version1/cla.json"
          path-to-document: "https://github.com/JamieScanlon/SwiftAgentHarness/blob/main/CLA.md"
          branch: "main"
          allowlist: JamieScanlon,dependabot[bot],bot*
          custom-notsigned-prcomment: >-
            Thank you for your contribution to SwiftAgentHarness! Before we can accept it,
            we ask that you read our [Contributor License Agreement](https://github.com/JamieScanlon/SwiftAgentHarness/blob/main/CLA.md)
            and sign it by posting the comment below. SwiftAgentHarness is dual-licensed (AGPL + commercial),
            and the CLA is what makes that possible — you keep full ownership of your work.
          custom-allsigned-prcomment: "All contributors have signed the CLA. Thank you!"
